name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
      contents: read

env: 
  CHECK_LABEL: training
jobs:
  lint:
    runs-on: ubuntu-26.04
    outputs:
      report-name: ${{ steps.report-meta.outputs.name }}
    steps:
      - name: Define report name
        id: report-meta
        run: echo 'name=test-report' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - name: Explain failure
        if: ${{ failure() }}
        run: echo 'A check failed. Open the first failed step and inspect its log.'
      - name: Lint
        run: mise run lint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    cache-mode: none
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            label: baseline
          - os: ubuntu-26.04
            label: current
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: dependencies
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run setup
      - name: Show cache result
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: printf 'Exact cache hit = %s\n' "$CACHE_HIT"
      - name: Test
        run: mise run test
      - name: Save test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-report-${{ matrix.os }}
          path: reports/test-results.xml
          retention-days: 7 
          if-no-files-found: error
  inspect-report:
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: test-report*
          path: received-report
      - name: Check downloaded report
        run: |
          test -s received-report/test-report-ubuntu-24.04/test-results.xml
          test -s received-report/test-report-ubuntu-26.04/test-results.xml

  demo-server:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - name: Start demo server
        id: server
        background: true
        run: mise run server-demo
      - name: Wait for readiness
        run: curl --fail --retry 60 --retry-connrefused --retry-delay 1 --max-time 2 --retry-max-time 120 http://127.0.0.1:3000/
      - name: Check responces
        run: test "$(curl --fail --silent http://127.0.0.1:3000/)" = ready
      - name: Stop demo server
        cancel: server

  inspect:
    runs-on: ubuntu-26.04
    steps:
      - name: Show workflow values
        run: |
          printf '%s\n' "$CHECK_LABEL"
          printf '%s\n' "$GITHUB_WORKFLOW"
      - name: Show step value
        env:
          CHECK_LABEL: local-step
        run: printf '%s\n' "$CHECK_LABEL"
      - name: Show workflow value again
        run: printf '%s\n' "$CHECK_LABEL"
      - name: Show run information
        env:
          LABEL: ${{ vars.CI_LABEL || 'trainig' }}
        run: printf '%s\n' "$LABEL"
      - name: Manual run information
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo 'This step was requested manually'

  secret:
    runs-on: ubuntu-26.04
    steps:
      - name: Read repository information
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq .full_name
      - name: Show pull request title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE"
